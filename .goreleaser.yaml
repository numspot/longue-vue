version: 2

# Public releases must not embed the proprietary NumSpot UI.
# UI-enabled distributions are built locally/in an authorized private pipeline.
builds:
  - id: longue-vue
    main: ./cmd/longue-vue
    binary: longue-vue
    tags: [noui]
    env: [CGO_ENABLED=0]
    goos: [linux, darwin]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w -X main.version={{.Version}} -X main.commit={{.Commit}} -X main.date={{.Date}}

  - id: longue-vue-collector
    main: ./cmd/longue-vue-collector
    binary: longue-vue-collector
    env: [CGO_ENABLED=0]
    goos: [linux, darwin]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w -X main.version={{.Version}} -X main.commit={{.Commit}} -X main.date={{.Date}}

  - id: longue-vue-ingest-gw
    main: ./cmd/longue-vue-ingest-gw
    binary: longue-vue-ingest-gw
    env: [CGO_ENABLED=0]
    goos: [linux, darwin]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w -X main.version={{.Version}} -X main.commit={{.Commit}} -X main.date={{.Date}}

  - id: longue-vue-vm-collector
    main: ./cmd/longue-vue-vm-collector
    binary: longue-vue-vm-collector
    env: [CGO_ENABLED=0]
    goos: [linux, darwin]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w -X main.version={{.Version}} -X main.commit={{.Commit}} -X main.date={{.Date}}

archives:
  - formats: [tar.gz]
    name_template: "{{ .Binary }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: "checksums.txt"

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  disable: true

release:
  header: |
    Public longue-vue binaries and container images are backend-only (`noui`):
    `/ui/` is unavailable. UI-enabled distributions require an authorized private
    NumSpot design-system build; see the UI build documentation in the repository.
  draft: false
  prerelease: auto
